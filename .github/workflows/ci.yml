name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui,files,dev]"

      - name: Test
        run: python -m pytest --cov=mla --cov-report=term-missing --cov-fail-under=75

      - name: Smoke test installed wheel
        run: |
          rm -rf /tmp/whl /tmp/mla-wheel-run
          python -m pip wheel . --no-deps -w /tmp/whl
          python -m pip install --force-reinstall --no-deps /tmp/whl/*.whl
          mkdir -p /tmp/mla-wheel-run
          cd /tmp/mla-wheel-run
          python -m mla check --contract "$(python -c 'import os, mla; print(os.path.join(os.path.dirname(mla.__file__), "data", "evalsets", "sample_contract.txt"))')"

      - name: Lint
        run: ruff check src tests scripts

      # 只检查 src：tests 里有既有的类型报错，本次不处理。
      # pyproject 里的 venv 设置是给本地开发用的，CI 没有 .venv；
      # 用 --pythonpath 指向本作业的 Python，让依赖从已安装的 site-packages 解析。
      - name: Type check
        run: python -m pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')" src

      - name: UI text rules
        run: python scripts/check_ui_text.py

      - name: Validate data
        run: |
          python scripts/validate_statutes.py src/mla/data/statutes/statutes.jsonl
          python scripts/validate_rules.py
          python scripts/validate_triggers.py
          python scripts/validate_missing_terms.py
          python scripts/validate_clause_gold.py
