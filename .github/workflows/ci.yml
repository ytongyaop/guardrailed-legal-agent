name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui,files,dev]"

      - name: Test
        run: python -m pytest

      - name: Lint
        run: ruff check src tests scripts

      - name: UI text rules
        run: python scripts/check_ui_text.py

      - name: Validate data
        run: |
          python scripts/validate_statutes.py data/statutes/statutes.jsonl
          python scripts/validate_rules.py
          python scripts/validate_triggers.py
          python scripts/validate_missing_terms.py
          python scripts/validate_clause_gold.py
