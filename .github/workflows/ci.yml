name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[files,web,dev]"

      - name: Install frontend deps
        run: npm --prefix web ci

      - name: Frontend type check
        run: npm --prefix web run typecheck

      - name: Frontend unit tests
        run: npm --prefix web run test -- --run

      # 生产态由 FastAPI 同源托管 web/dist（006 §1），E2E 与 wheel 冒烟都要求先构建
      - name: Build frontend
        run: npm --prefix web run build

      - name: Test
        run: python -m pytest --cov=mla --cov-report=term-missing --cov-fail-under=75

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: E2E
        working-directory: web
        env:
          # CI 是 Linux：用安装好的 Chromium，本机开发默认 msedge 的设定不适用于这里
          MLA_PLAYWRIGHT_CHANNEL: chromium
          # playwright.config.ts 默认指向 .venv，CI 里没有虚拟环境，用作业自带解释器
          MLA_PYTHON: python
        run: npx playwright test

      - name: Smoke test installed wheel
        run: |
          rm -rf /tmp/whl /tmp/mla-wheel-run
          # 静态产物随 wheel 打包（006 §5）：先复制构建产物进包目录，再打 wheel
          mkdir -p src/mla/api/static
          cp -r web/dist/. src/mla/api/static/
          python -m pip wheel . --no-deps -w /tmp/whl
          python -m pip install --force-reinstall --no-deps /tmp/whl/*.whl
          mkdir -p /tmp/mla-wheel-run
          cd /tmp/mla-wheel-run
          CONTRACT="$(python -c 'import os, mla; print(os.path.join(os.path.dirname(mla.__file__), "data", "evalsets", "sample_contract.txt"))')"
          # 1) 版本可读
          python -m mla --version
          # 2) 前端构建产物真的进了包（缺了页面会 503，只有 API 能用）
          python -c 'import pathlib, mla; index = pathlib.Path(mla.__file__).parent / "api" / "static" / "index.html"; assert index.is_file(), index'
          # 3) 无模型时核对必须被拒绝（退出码≠0）
          if python -m mla check --contract "$CONTRACT"; then
            echo "::error::无模型时 mla check 应返回非零退出码"
            exit 1
          fi
          # 4) 离线诊断模式应可跑
          MLA_ALLOW_NO_LLM=1 python -m mla check --contract "$CONTRACT" > /dev/null

      - name: Lint
        run: ruff check src tests scripts

      # 只检查 src：tests 里有既有的类型报错，本次不处理。
      # pyproject 里的 venv 设置是给本地开发用的，CI 没有 .venv；
      # 用 --pythonpath 指向本作业的 Python，让依赖从已安装的 site-packages 解析。
      - name: Type check
        run: python -m pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')" src

      - name: UI text rules
        run: python scripts/check_ui_text.py

      - name: Validate data
        run: |
          python scripts/validate_statutes.py src/mla/data/statutes/statutes.jsonl
          python scripts/validate_rules.py
          python scripts/validate_triggers.py
          python scripts/validate_missing_terms.py
          python scripts/validate_clause_gold.py
          python scripts/validate_elements.py

  # 打包冒烟：在 Windows 上真打一次 exe 并起服务访问。
  # 单独成 job 而不是塞进 test 的 matrix：打包要 windows-latest + Node 构建，混在一起只会互相拖慢。
  # 这里**不跑 pytest**（那是 test job 的事），只验证「产物能启动、能出页面、能建号」。
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[files,web,package]"

      - name: Install frontend deps
        run: npm --prefix web ci

      - name: Build frontend
        run: npm --prefix web run build

      # 与 scripts/build_exe.ps1 第 3 步同一口径：先清空，避免残留旧哈希资源被打进包
      - name: Stage frontend into package
        run: |
          if (Test-Path src/mla/api/static) { Remove-Item src/mla/api/static -Recurse -Force }
          New-Item -ItemType Directory -Path src/mla/api/static -Force | Out-Null
          Copy-Item -Path web/dist/* -Destination src/mla/api/static -Recurse -Force

      - name: Build exe
        run: python -m PyInstaller mla.spec --noconfirm --clean

      # 全程落 RUNNER_TEMP：不写用户目录，也不污染仓库；
      # 端口优先读 MLA_PORT_FILE（比解析控制台稳），失败再打印 exe 的 stdout/stderr 与 mla.log。
      - name: Smoke test packaged exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "dist\mla\mla.exe"
          $staticIndex = "dist\mla\_internal\mla\api\static\index.html"

          if (-not (Test-Path $exe)) { throw "缺少产物：$exe" }
          if (-not (Test-Path $staticIndex)) { throw "前端产物未进包：$staticIndex" }

          $tmp = Join-Path $env:RUNNER_TEMP "mla-smoke"
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null

          $env:MLA_HOME = Join-Path $tmp "home"
          $env:MLA_DB = Join-Path $tmp "smoke.sqlite3"
          $env:MLA_NO_BROWSER = "1"
          $env:MLA_PORT_FILE = Join-Path $tmp "port.txt"
          $stdout = Join-Path $tmp "stdout.txt"
          $stderr = Join-Path $tmp "stderr.txt"

          function Show-Outputs {
            Write-Host "--- exe stdout ---"
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host "--- exe stderr ---"
            if (Test-Path $stderr) { Get-Content $stderr }
            $log = Join-Path $env:MLA_HOME "logs\mla.log"
            if (Test-Path $log) {
              Write-Host "--- mla.log ---"
              Get-Content $log
            }
          }

          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          try {
            $port = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              if (Test-Path $env:MLA_PORT_FILE) {
                $raw = Get-Content $env:MLA_PORT_FILE -Raw -ErrorAction SilentlyContinue
                if ($raw -and $raw.Trim()) {
                  $port = $raw.Trim()
                  break
                }
              }
              if ($proc.HasExited) { break }
            }
            if (-not $port) {
              Show-Outputs
              throw "exe 未在 60 秒内报告端口（HasExited=$($proc.HasExited)）"
            }

            $base = "http://127.0.0.1:$port"
            Write-Host "MLA_PORT=$port"

            $root = Invoke-WebRequest -Uri "$base/" -UseBasicParsing -TimeoutSec 30
            Write-Host "GET / -> $($root.StatusCode)"
            if ($root.StatusCode -ne 200) { throw "GET / 期望 200，实际 $($root.StatusCode)" }

            $setup = Invoke-WebRequest -Uri "$base/api/setup" -UseBasicParsing -TimeoutSec 30
            Write-Host "GET /api/setup -> $($setup.StatusCode)"
            if ($setup.StatusCode -ne 200) { throw "GET /api/setup 期望 200，实际 $($setup.StatusCode)" }

            $body = '{"username":"smoke","password":"smoke-pass-123","confirm_password":"smoke-pass-123","enterprise_name":"smoke"}'
            $admin = Invoke-WebRequest -Uri "$base/api/setup/admin" -Method Post -Body $body `
              -ContentType "application/json; charset=utf-8" -UseBasicParsing -TimeoutSec 60
            Write-Host "POST /api/setup/admin -> $($admin.StatusCode)"
            if ($admin.StatusCode -ne 201) { throw "POST /api/setup/admin 期望 201，实际 $($admin.StatusCode)" }
          }
          catch {
            Show-Outputs
            throw
          }
          finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

          $size = (Get-ChildItem "dist\mla" -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("目录体积：{0:N1} MB" -f $size)
