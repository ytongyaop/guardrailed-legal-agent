name: 功能建议
description: 提出新的使用场景或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 说明你在什么情况下需要这个能力，越具体越好。
      placeholder: 例如：我需要一次核对十几份合同，希望命令行能输出可汇总的表格。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方式
      description: 说明你希望系统怎么解决，包括你设想的输入与输出。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 现在怎么绕过的，或者其他可行思路。没有可以留空。
  - type: dropdown
    id: pull-request
    attributes:
      label: 是否愿意提交 PR
      options:
        - 愿意
        - 暂时不能
    validations:
      required: true
