[build-system]
# PEP 639 的 `project.license-files` 需要 setuptools>=77
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mla"
dynamic = ["version"]
description = "Guardrailed agent for labor-contract risk review"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2.0", "PyYAML>=6.0,<7.0"]
keywords = ["legal-tech", "labor-contract", "llm", "retrieval-augmented-generation", "guardrails"]
authors = [{ name = "ytongyaop" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Intended Audience :: Legal Industry",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/ytongyaop/guardrailed-legal-agent"
Repository = "https://github.com/ytongyaop/guardrailed-legal-agent"
Issues = "https://github.com/ytongyaop/guardrailed-legal-agent/issues"

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2.0", "pandas>=1.5", "altair>=5.0"]
files = ["python-docx>=1.1,<2.0", "pypdf>=4.0,<7.0"]
dev = ["pytest", "pytest-cov", "ruff", "pyright"]

[project.scripts]
mla = "mla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mla = ["data/**/*.jsonl", "data/**/*.yaml", "data/**/*.txt", "data/**/*.json", "data/**/*.md"]

[tool.setuptools.exclude-package-data]
# 评测/向量缓存是可再生的运行期产物，不进 wheel
mla = ["data/index/*", "data/evalsets/last_*.json", "data/evalsets/*_history.jsonl"]

[tool.setuptools.dynamic]
version = {attr = "mla.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
