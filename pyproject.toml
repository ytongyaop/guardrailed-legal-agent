[build-system]
# PEP 639 的 `project.license-files` 需要 setuptools>=77
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mla"
dynamic = ["version"]
description = "Guardrailed agent for labor-contract risk review"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2.0", "PyYAML>=6.0,<7.0"]
keywords = ["legal-tech", "labor-contract", "llm", "retrieval-augmented-generation", "guardrails"]
authors = [{ name = "ytongyaop" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Intended Audience :: Legal Industry",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/ytongyaop/guardrailed-legal-agent"
Repository = "https://github.com/ytongyaop/guardrailed-legal-agent"
Issues = "https://github.com/ytongyaop/guardrailed-legal-agent/issues"

[project.optional-dependencies]
# 0.4.0 起界面是 FastAPI + Vue（规格 006），Streamlit 专用依赖（streamlit / pandas / altair）已随
# `src/mla/ui/` 一起删除。API 自己用 pydantic（`api/schemas.py`），导出 Word 报告要 python-docx
# （`services/report.py` 顶层 import），所以这两条挂在 `web` extra 上——只装 `web` 就能起完整服务。
files = ["python-docx>=1.1,<2.0", "pypdf>=4.0,<7.0"]
# 0.4.0 Web 层（规格 006）：FastAPI 只做同源 API，不引入 CORS / 模板引擎
web = [
    "fastapi>=0.163,<0.200",
    "uvicorn[standard]>=0.54,<1.0",
    "python-multipart>=0.0.33,<0.1",
    "pydantic>=2.0,<3.0",
    "python-docx>=1.1,<2.0",
]
dev = ["pytest", "pytest-cov", "ruff", "pyright"]
# 1.0.0 打包（`mla.spec` + `scripts/build_exe.ps1`）才需要的构建期依赖：
# 只有打 exe 时才装，不进 `dev`（它跟开发/测试无关），也不进任何运行期 extra。
package = ["pyinstaller>=6.0"]

[project.scripts]
mla = "mla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `api/static/**` 是前端构建产物（006 §5：静态产物随 wheel 打包，`web/dist` 只在源码态用）。
# 构建 wheel/exe 前必须先跑 `npm --prefix web run build` 并把产物放进 `src/mla/api/static/`。
mla = [
    "data/**/*.jsonl",
    "data/**/*.yaml",
    "data/**/*.txt",
    "data/**/*.json",
    "data/**/*.md",
    "api/static/*",
    "api/static/**/*",
]

[tool.setuptools.exclude-package-data]
# 评测/向量缓存是可再生的运行期产物，不进 wheel
mla = ["data/index/*", "data/evalsets/last_*.json", "data/evalsets/*_history.jsonl"]

[tool.setuptools.dynamic]
version = {attr = "mla.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
# 规格 003 第 9.2 节的两套划分：默认 `pytest` 仍跑全部（含未打标记的用例），
# `pytest -m no_llm` / `pytest -m mock_llm` 分别只跑一套，两套都必须全绿。
markers = [
  "no_llm: 不需要模型的用例（门禁、设置、历史、规则引擎、纯函数）",
  "mock_llm: 用假 Generator 走模型主导路径的用例",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
