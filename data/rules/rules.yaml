  threshold: 5
  unit: 天
  statute_id: AL-3
  severity: 硬性
  effective_date: "2008-01-01"
  when_field: work_years
  when_op: ">="
  when_value: 1
  when_field2: work_years
  when_op2: "<"
  when_value2: 10
  evidence_span: "职工累计工作已满1年不满10年的，年休假5天"

- rule_id: R-AL-10D
  name: 累计工作满 10 年不满 20 年，年休假 10 天
  field: annual_leave_days
  op: ">="
  threshold: 10
  unit: 天
  statute_id: AL-3
  severity: 硬性
  effective_date: "2008-01-01"
  when_field: work_years
  when_op: ">="
  when_value: 10
  when_field2: work_years
  when_op2: "<"
  when_value2: 20
  evidence_span: "已满10年不满20年的，年休假10天"

- rule_id: R-AL-15D
  name: 累计工作满 20 年，年休假 15 天
  field: annual_leave_days
  op: ">="
  threshold: 15
  unit: 天
  statute_id: AL-3
  severity: 硬性
  effective_date: "2008-01-01"
  when_field: work_years
  when_op: ">="
  when_value: 20
  evidence_span: "已满20年的，年休假15天"

- rule_id: R-ALI-UNUSED-300
  name: 未休年休假按日工资收入的 300% 支付
  field: unused_leave_pay_ratio
  op: ">="
  threshold: 300
  unit: "%"
  statute_id: ALI-10
  severity: 硬性
  effective_date: "2008-09-18"
  evidence_span: "按照其日工资收入的300%支付未休年休假工资报酬"

# ---------- 工资支付（WPR-7）----------
- rule_id: R-WPR-MONTHLY-PAY
  name: 工资至少每月支付一次
  field: pay_times_per_month
  op: ">="
  threshold: 1
  unit: 次
  statute_id: WPR-7
  severity: 硬性
  effective_date: "1995-01-01"
  evidence_span: "工资至少每月支付一次"
