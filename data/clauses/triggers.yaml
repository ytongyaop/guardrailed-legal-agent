# 条款触发器表（存在性域）
#
# 约定：
#   1) 一条触发器 = 一个可疑模式；本层只**召回**，不做违法/合规判定。
#   2) patterns 用 Python re 语法，逐段（非空行）对 _norm() 后的文本做 re.search；
#      中文标点/空格不影响命中——pattern 里尽量不写标点，用 .{0,N} 跨过。
#   3) candidate_statute_ids 是**闭集**：模型只能从这里选法条（规格 2.3/2.4），
#      因此必须全部存在于 data/statutes/statutes.jsonl；宁可略宽给模型选择空间，不塞无关条文。
#   4) severity_hint 只是提示（A/B/C），最终等级由模型判定 + 程序核验决定。
#   5) ask_fields 是「待补事实」，B/C 级用得上；写空列表表示无需补充。
#   6) 运行时以 scripts/validate_triggers.py 校验：ID 唯一、pattern 可编译、
#      法条存在、gold 正样本覆盖率达标；此外**负样本零触发**与**四份合同候选数**
#      也是硬门禁（放宽前先读该脚本 docstring）。

# ---------- 单方变更劳动合同（调岗 / 降薪）----------
- trigger_id: TR-UNILATERAL-TRANSFER
  name: 单方强制调岗 / 调整工作地点，拒绝即视为违纪解除
  patterns:
    - '单方(?:无条件)?(?:调整|变更|调动|指派).{0,12}(?:岗位|工作地点|工作内容)'
    - '(?:调整|变更|调动)(?:乙方)?(?:的)?(?:岗位|工作地点|工作内容).{0,10}不得拒绝'
    - '拒绝(?:调岗|调整|调动).{0,12}(?:视为|按|属于|构成).{0,8}(?:严重违反|解除|违纪)'
    # 写作变体：不写单方/无条件、只写调整 + 服从，是高频写法，
    # 语义上仍是劳动者无协商余地的单方变更。三条都要求「岗位类词 + 调整类词 + 服从」三者同现，
    # 只谈「协商一致后调整」的合规句不含「服从」，不召回（compliant_01 该条仍 0 候选）。
    - '(?:调整|变更|调动|指派)(?:乙方)?(?:的)?(?:工作)?(?:岗位|工作地点|工作内容).{0,12}(?:乙方|员工|劳动者|职工)?.{0,6}服从'
    - '(?:岗位|工作地点|工作内容)(?:的)?(?:调整|变更|调动).{0,12}(?:乙方|员工|劳动者|职工)?.{0,6}服从'
    - '(?:调岗|调店|调动|调整).{0,10}(?:乙方|员工|劳动者|职工)?(?:应|须|应当|必须|需|一律)?(?:无条件)?服从'
  candidate_statute_ids: [LCL-35, LCL-39, LCL-46, LCL-87]
  severity_hint: A
  ask_fields: []

- trigger_id: TR-UNILATERAL-PAY-CUT
  name: 单方降低工资 / 绩效工资降至零，无需协商
  patterns:
    - '单方(?:面)?(?:降低|下调|减少|扣减).{0,8}(?:工资|薪资|绩效|报酬|薪酬)'
    - '(?:绩效工资|工资|薪酬|薪资).{0,10}(?:可以|可|有权|直接).{0,6}(?:降至|降低至|下调至)[0零]'
    - '(?:无需|不需|未)(?:与乙方|经乙方|同乙方)?(?:协商).{0,12}(?:降低|调整|变更).{0,8}(?:工资|薪资|绩效|薪酬)'
  candidate_statute_ids: [LCL-35, WPR-15, LL-50, LCL-26]
  severity_hint: A
  ask_fields: []

# ---------- 工时制度 ----------
- trigger_id: TR-OUTSOURCED-HOURS-NO-APPROVAL
  name: 实行不定时 / 综合计算工时但未经行政审批备案
  patterns:
    - '(?:不定时|综合计算|综合工时)(?:工作制|工时制|工时工作制)'
    - '(?:无需|不需|不必|无须|免于).{0,8}(?:劳动|人社|人力资源社会保障).{0,8}(?:部门)?.{0,6}(?:审批|备案|批准)'
  candidate_statute_ids: [LL-39, WPR-13]
  severity_hint: B
  ask_fields:
    - 该岗位是否已取得不定时 / 综合计算工时的行政审批
    - 该岗位是否属于可实行不定时 / 综合计算工时的岗位范围

# ---------- 加班与休息休假 ----------
- trigger_id: TR-OVERTIME-WAIVER
  name: 约定放弃加班费 / 加班不另付报酬 / 排除加班工资救济
  patterns:
    - '(?:自愿)?放弃.{0,8}加班(?:费|工资|报酬)'
    - '加班.{0,12}(?:不再|不予|无需|不)(?:另行)?(?:支付|计发|计算|发放)'
    - '(?:不得|无权)(?:就)?(?:加班)?(?:工资|费)?(?:加班工资|加班费)?(?:提起|申请).{0,4}(?:仲裁|诉讼)'
    # 写作变体：加班不另付报酬、加班费已经包含在月薪里，两类口语写法，
    # 前者补「另付 / 另计 / 不补」动词，后者补「已包含在工资」句式；都要求「加班」在前，
    # 按法定比例「支付加班工资」的合规句不匹配。
    - '加班.{0,12}(?:不|不再|不予|无需|无须)(?:另行|另|单独|额外)?(?:支付|给付|计发|计算|发放|付|计|补)'
    - '加班(?:费|工资|报酬|待遇).{0,6}(?:已经|已|均)?(?:包含|含|包括)(?:在)?(?:月薪|月工资|工资|薪资|底薪|薪酬)'
  candidate_statute_ids: [LCL-31, LL-44, LCL-26]
  severity_hint: A
  ask_fields: []

- trigger_id: TR-DISPATCH-NO-OVERTIME-PAY
  name: 外派 / 驻场期间一律不计加班
  patterns:
    - '(?:外派|驻场|出差|借调).{0,12}(?:不计|不另计|不另行计算|不视为|不予计算)(?:加班)'
    - '(?:服从).{0,12}(?:外派|驻场|出差|借调).{0,12}(?:安排)'
  candidate_statute_ids: [LCL-31, LL-44, LCL-26]
  severity_hint: A
  ask_fields: []

# ---------- 加班费计算基数 ----------
# 定级只能到 B：是否违法取决于合同外事实（基本工资数额 / 正常工作时间工资数额 /
# 当地最低工资标准），不满足 A 级「法条明文禁止、无需补事实」的口径。
- trigger_id: TR-OT-BASE-LOW
  name: 加班费按基本工资或最低工资计基数
  patterns:
    - '加班(?:费|工资|工资报酬)?(?:的)?(?:计算|计发)?基数(?:为|按|按照|以)'
    - '(?:以|按)基本工资.{0,10}(?:作为|计|计算).{0,6}加班(?:费|工资)'
    - '加班(?:费|工资).{0,6}(?:按|以).{0,6}(?:最低工资|基本工资|底薪)'
  candidate_statute_ids: [LL-44, LL-48, LCL-17]
  severity_hint: B
  ask_fields: [基本工资数额, 正常工作时间工资数额, 当地最低工资标准]

- trigger_id: TR-ANNUAL-LEAVE-OFFSET
  name: 年休假统一抵扣 / 员工不得单独申请
  patterns:
    - '(?:年假|年休假|带薪年休假).{0,12}(?:统一|一律|集中).{0,10}(?:安排|抵扣|折抵|冲抵)'
    - '(?:春节|法定假日|法定节假日).{0,10}(?:假期)?.{0,8}(?:抵扣|折抵|冲抵|算作|计入).{0,6}(?:年假|年休假)'
    - '(?:不得|无权|不能)(?:单独)?(?:申请)?(?:休)?(?:带薪)?年(?:休)?假'
  candidate_statute_ids: [AL-3, AL-5, ALI-9, ALI-10]
  severity_hint: B
  ask_fields:
    - 春节假期中实际用于抵扣年假的天数
    - 抵扣天数是否与法定休假日、休息日重叠
    - 当年度未休年假是否按 300% 支付

# ---------- 劳动报酬 ----------
- trigger_id: TR-PROBATION-WAGE-BASE
  name: 试用期工资按基本工资比例发放（基数可能低于法定口径）
  patterns:
    - '试用期(?:工资|薪资|报酬).{0,10}按(?:照)?(?:基本工资|底薪|基本薪资)'
    - '试用期(?:工资|薪资|报酬).{0,12}\d{2,3}[%％]'
  candidate_statute_ids: [LCL-20, LL-48, LCL-26]
  severity_hint: A
  ask_fields:
    - 劳动合同约定的月工资标准（试用期工资的比较基数）
    - 用人单位所在地最低工资标准

- trigger_id: TR-WAGE-DELAY
  name: 约定延迟发放工资 / 最长延迟若干日
  patterns:
    - '(?:延迟|延后|延期|缓发|推迟|缓付).{0,8}(?:发放|支付|结算).{0,4}工资'
    - '工资.{0,12}(?:延迟|延后|延期|缓发|推迟)(?:发放|支付)'
    - '(?:最长|最多|不超过|不得超过).{0,6}(?:延迟|延期|推迟).{0,4}\d{1,3}(?:日|天)'
  candidate_statute_ids: [WPR-7, LL-50, WPR-18, LCL-26]
  severity_hint: A
  ask_fields: []

- trigger_id: TR-WAGE-WITHHOLD-ON-EXIT
  name: 离职时扣留 / 冻结工资、绩效、奖金
  patterns:
    - '(?:离职|解除|终止).{0,16}(?:扣留|扣押|冻结|暂扣|扣发|不予结算|不结算).{0,12}(?:工资|绩效|奖金|报酬|薪酬)'
    - '(?:扣留|扣押|冻结|暂扣).{0,12}(?:未结算|未发放|尚未)'
    # 以「交接」为名扣款的两类口语写法（traps_03「作为交接保证金」）。
    - '交接.{0,8}(?:保证金|押金)'
    - '(?:未|不)(?:办理|完成|配合).{0,6}交接.{0,10}(?:不予|暂缓|扣|延迟).{0,6}(?:结算|发放|支付)'
  candidate_statute_ids: [WPR-9, LL-50, WPR-15, LCL-26]
  severity_hint: A
  ask_fields: []

# ---------- 社会保险与工伤 ----------
- trigger_id: TR-SI-WAIVER
  name: 约定放弃缴纳社保 / 以现金补贴替代社保
  patterns:
    - '放弃(?:缴纳|缴|交|参加)?(?:社保|社会保险)'
    - '放弃.{0,10}(?:社保|社会保险)'
    - '(?:社保|社会保险)(?:单位部分|单位缴费部分)?.{0,8}(?:折算|折合|置换|兑换|换成)(?:为|成)?现金'
    - '(?:不|未|无需|免于|不再)(?:为乙方|为劳动者)?(?:缴纳|缴|办理|申报).{0,6}(?:社保|社会保险)'
    - '(?:现金|补贴).{0,10}(?:替代|代替|顶替).{0,8}(?:社保|社会保险)'
  candidate_statute_ids: [J2-19, SIL-58, SIL-60, LL-72, LCL-26]
  severity_hint: A
  ask_fields: []

- trigger_id: TR-WORK-INJURY-WAIVER
  name: 工伤责任全部由劳动者自负 / 不承担工伤保险待遇
  patterns:
    - '(?:工伤|工伤保险).{0,14}(?:责任|费用|赔偿|赔付).{0,8}(?:由乙方|由劳动者|由本人)(?:自行)?(?:承担|负责)'
    - '(?:不承担|不负责|无需承担|不负).{0,10}工伤(?:保险)?(?:法定)?(?:赔付|赔偿|待遇|责任)'
  candidate_statute_ids: [WI-2, WI-62, WI-14]
  severity_hint: A
  ask_fields: []

- trigger_id: TR-OCCUPATIONAL-DISEASE-DISCLAIM
  name: 一概排除工伤 / 职业病认定，归因于个人体质
  patterns:
    - '(?:不属于|不算|不构成|不在)(?:工伤|职业病)'
    - '(?:属于|系|归为|归因于).{0,8}(?:个人体质|个人原因|自身原因).{0,16}(?:不属于|不算|不构成|与.{0,4}无关)'
  candidate_statute_ids: [WI-14, WI-2, WI-15]
  severity_hint: B
  ask_fields:
    - 乙方所患疾病是否已由职业病诊断机构作出职业病诊断
    - 乙方岗位是否存在职业病危害因素接触史
    - 用人单位是否依法履行职业危害告知与防护义务

# ---------- 解除与违约金 ----------
- trigger_id: TR-DISMISSAL-PENALTY
  name: 约定劳动者离职需支付违约金 / 赔偿招聘培训成本
  patterns:
    - '(?:离职|辞职|解除).{0,20}(?:支付|赔付|缴纳)(?:违约金|赔偿金)'
    - '违约金.{0,12}(?:离职|辞职)'
    - '(?:无论任何原因|任何原因).{0,10}(?:离职|辞职).{0,12}(?:违约金|赔偿)'
  candidate_statute_ids: [LCL-25, LCL-22, LCL-23]
  severity_hint: A
  ask_fields: []

# ---------- 服务期与试用期解除 ----------
# 定级只能到 B：是否有专项培训 + 培训费用、违约金是否超培训费、解除理由是否成立，
# 都要靠合同外事实认定，不满足 A 级口径。
- trigger_id: TR-SERVICE-PERIOD-PENALTY
  name: 服务期内离职须赔偿
  patterns:
    - '服务期(?:内)?(?:离职|辞职|解除|违约).{0,12}(?:赔偿|违约金|赔付)'
    - '(?:未满|未履行满)服务期.{0,10}(?:离职|辞职).{0,10}(?:赔偿|违约金)'
    - '服务期.{0,12}(?:违约金|赔偿金).{0,6}[0-9一二三四五六七八九十]{1,6}'
  candidate_statute_ids: [LCL-22, LCL-25]
  severity_hint: B
  ask_fields: [是否提供专项培训及培训费用数额, 违约金数额, 已服务月数]

# 收紧说明（后人不得放宽）：
# 更宽的 pattern 只要求「试用期 + 解除/辞退」，不要求「用人单位主语 + 随时/任意」。
# 实测该宽版会命中合规对照样本 contract_compliant_01.txt 的
# 「试用期内提前 3 日通知即可解除」（那是**劳动者**一方的解除权，完全合法）。
# 因此收紧为三条：主语必须是甲方/公司/用人单位 + 随时/任意；或「不合格/不符合录用条件 + 即/就/一律/直接」。
# 想放宽的人先回答：怎样把「乙方提前 3 日通知即可解除」排除在外？
- trigger_id: TR-PROBATION-ARBITRARY-DISMISSAL
  name: 试用期内可随时解除且未设录用条件
  patterns:
    - '(?:甲方|公司|用人单位|企业)(?:有权|可|可以)?.{0,8}(?:随时|任意).{0,8}(?:解除|辞退)(?:本)?(?:劳动)?合同'
    - '试用期(?:内|间).{0,10}(?:甲方|公司|用人单位)(?:有权|可|可以).{0,6}(?:随时)?(?:解除|辞退)'
    - '试用期.{0,10}(?:不合格|不符合录用条件).{0,6}(?:即|就|一律|直接).{0,4}(?:解除|辞退)'
  candidate_statute_ids: [LCL-21, LCL-39]
  severity_hint: B
  ask_fields: [是否约定录用条件与考核标准, 解除时是否说明理由]

- trigger_id: TR-RESIGN-NOTICE-EXTEND
  name: 辞职提前通知期超过 30 日 / 未提前通知即按违约扣工资
  patterns:
    - '提前(?:[2-9]|[1-9]\d|[二三四五六七八九两]|十[一二三四五六]?)(?:个)?月.{0,10}(?:书面)?(?:通知|提出|申请)'
    - '(?:未|没有)(?:提前|按).{0,12}(?:通知|提出).{0,10}(?:视为|按|属)(?:违约|旷工|自动离职)'
    - '(?:按日|每日|逐日)(?:扣除|扣减|扣发)(?:工资|薪酬)'
  candidate_statute_ids: [LCL-37, LCL-26, WPR-15]
  severity_hint: A
  ask_fields: []

- trigger_id: TR-NO-COMPENSATION-TERMINATION
  name: 随时解除且无需支付经济补偿 / 赔偿金
  patterns:
    - '随时.{0,12}(?:解除|终止)(?:本)?(?:劳动)?合同'
    - '(?:无需|无须|不予|不须|不需|不)(?:再)?(?:支付|给予|承担|计发).{0,10}(?:经济补偿|经济补偿金|赔偿金)'
    - '(?:不予|不承担|免除).{0,6}(?:经济补偿|经济补偿金|赔偿金)'
  candidate_statute_ids: [LCL-46, LCL-40, LCL-87, LCL-26]
  severity_hint: A
  ask_fields: []

# ---------- 保密与竞业限制 ----------
- trigger_id: TR-NONCOMPETE-ALL-STAFF
  name: 全员适用竞业限制 / 不支付竞业限制补偿
  patterns:
    - '(?:所有|全体|全部|任何|各)岗位.{0,12}竞业'
    - '竞业限制.{0,14}(?:不|未|无需|不予|无须)(?:支付|给|发放).{0,8}(?:补偿|经济补偿)'
    - '(?:不|未|无需|不予)支付.{0,8}(?:任何)?竞业限制'
  candidate_statute_ids: [LCL-23, LCL-24, J1-36, J2-13, LCL-25]
  severity_hint: A
  ask_fields: []

- trigger_id: TR-CONFIDENTIAL-UNLIMITED
  name: 保密义务永久 / 无期限
  patterns:
    - '保密(?:义务)?.{0,10}(?:永久|无期限|无限期|长期有效)'
    - '(?:永久|无期限|无限期).{0,10}保密'
  candidate_statute_ids: [LCL-23, LCL-24, J2-13]
  severity_hint: C
  ask_fields:
    - 保密信息的具体范围，相关商业秘密是否持续存在
    - 无期限保密义务是否实际限制劳动者再就业（是否变相替代竞业限制）

# ---------- 排除劳动者权利 / 排除法律适用 ----------
- trigger_id: TR-GENERAL-WAIVER
  name: 概括放弃既往与未来的全部劳动权利
  patterns:
    - '放弃(?:既往|以往|过去|未来|将来|所有|全部).{0,20}(?:权利|请求权|主张)'
    - '放弃.{0,30}(?:劳动报酬|社保|社会保险|加班|经济补偿).{0,12}(?:的权利|请求权|权利)'
    - '(?:视为|即代表|表示).{0,12}放弃.{0,20}(?:权利|请求权)'
  candidate_statute_ids: [LCL-26, LCL-27]
  severity_hint: A
  ask_fields: []

- trigger_id: TR-ARBITRATION-WAIVER
  name: 约定不得申请劳动仲裁 / 只能直接起诉
  patterns:
    - '(?:不得|不能|无权|放弃|排除).{0,10}(?:向)?(?:劳动(?:争议)?仲裁(?:委员会|委|机构)?).{0,10}(?:申请)?(?:仲裁)'
    - '(?:只能|应|须|一律)(?:向)?.{0,8}(?:人民法院|法院)(?:直接)?(?:起诉|诉讼|提起诉讼)'
    - '排除.{0,6}(?:劳动)?仲裁'
  candidate_statute_ids: [LDA-5, LDA-2, LCL-26]
  severity_hint: A
  ask_fields: []

- trigger_id: TR-RULES-NO-PUBLICITY
  name: 规章制度无需公示 / 自动对劳动者生效
  patterns:
    - '(?:规章制度|员工手册|员工守则|管理办法).{0,14}(?:无需|无须|不需|不必).{0,8}(?:公示|告知|送达)'
    - '(?:无需|无须).{0,8}公示.{0,10}(?:自动|即).{0,6}(?:生效|约束|适用)'
  candidate_statute_ids: [LCL-4, LCL-26]
  severity_hint: A
  ask_fields: []

- trigger_id: TR-CONTRACT-OVER-LAW
  name: 约定合同优先于国家法律适用
  patterns:
    - '(?:本合同|本协议).{0,10}(?:优先|效力高于|优于|大于).{0,10}(?:国家)?(?:法律|法规|法定)'
    - '(?:与|和|同)(?:国家)?(?:法律|法规).{0,10}(?:冲突|不一致|抵触).{0,12}(?:以|按)(?:本合同|本协议)(?:约定)?为准'
  candidate_statute_ids: [LCL-26, LCL-27]
  severity_hint: A
  ask_fields: []

# ---------- 试用期期限 / 书面合同 / 休息日 / 押金（扩样补缺 4 类）----------
#
# 口径说明（TR-PROBATION-TERM-EXCEED）：本层只召回「约定了试用期期限」的句子，
# 月数是否超 LCL-19 上限由模型结合合同期限判断。已知的两处合法对照
# （traps_01「试用期：6 个月，自…」、compliant_01「…止，试用期 6 个月」）写法是
# 「试用期 + 阿拉伯数字」，这里用「须有约定动词（定/为/是/约定…）或中文数字」把
# 纯数字裸写挡在外面：代价是漏召回「试用期 6 个月」这类裸写句（合规/违法判断都得
# 靠合同期限，不应由本层定），换来的是负样本零误触发。若将来要求连裸写也召回，
# 需同时接受 traps_01 / compliant_01 各多 1 条候选。
- trigger_id: TR-PROBATION-TERM-EXCEED
  name: 约定了试用期期限（月数 / 天数），是否超法定上限需结合合同期限判断
  patterns:
    - '试用期(?:期限|时长)?(?:约定|定为|定|设为|设|为|是|共|计)[一二三四五六七八九十两柒捌玖\d]{1,3}(?:个)?月'
    - '试用期[^，。；,;0-9]{0,3}[一二三四五六七八九十两柒捌玖]{1,3}(?:个)?月'
    - '试用期(?:为|是|定|共|计)?[0-9一二三四五六七八九十两柒捌玖]{1,3}天'
  candidate_statute_ids: [LCL-19]
  severity_hint: A
  ask_fields:
    - 劳动合同的期限类型与年限（固定期限 / 无固定期限 / 以完成一定工作任务为期限）
    - 同一用人单位与同一劳动者是否已约定过试用期

- trigger_id: TR-WRITTEN-CONTRACT-DELAY
  name: 先用工后签书面劳动合同 / 约定不签书面合同
  patterns:
    - '先干着|先上岗'
    - '满.{0,4}(?:个)?月.{0,6}再签'
    - '(?:入职|用工).{0,10}(?:满|超过).{0,6}(?:个)?月.{0,10}(?:签|订立)'
    - '不签(?:书面)?(?:劳动)?合同'
  candidate_statute_ids: [LCL-10, LCL-82]
  severity_hint: A
  ask_fields: []

- trigger_id: TR-REST-DAY-INSUFFICIENT
  name: 每周休息日不足（每月只休 1—4 天）
  patterns:
    - '每月(?:休息|休|放假)[^0-9一二三四]{0,4}(?:1|2|3|4|一|二|三|四)天'
    - '月休(?:1|2|3|4|一|二|三|四)天'
  candidate_statute_ids: [LL-38]
  severity_hint: A
  ask_fields: []

- trigger_id: TR-DEPOSIT-OR-FEES
  name: 向劳动者收取押金 / 保证金 / 培训费，或扣留身份证件
  # 前置否定排除：合规声明「不收取任何形式的押金、保证金」「无需缴纳保证金」
  # 「不扣押身份证件」不得命中。写法 `^(?:(?!<否定>).)*<关键词>`：从行首逐字扫描，
  # 关键词之前一旦出现「不/无/免 + 6 字内 + 收/缴/扣/索取」就整行不匹配；
  # 关键词之后的否定（如「押金 500 元，离职不退还」）不受影响，仍召回。
  patterns:
    - '^(?:(?!(?:不|无|免).{0,6}(?:收|缴|扣|索取)).)*(?:押金|保证金)'
    - '^(?:(?!(?:不|无|免).{0,6}(?:收|缴|扣|索取)).)*(?:收取|收受|交|扣|索取).{0,4}(?:押金|保证金|培训费|服装费)'
    - '^(?:(?!(?:不|无|免).{0,6}(?:收|缴|扣|索取)).)*(?:扣留|扣押).{0,4}(?:身份证|证件)'
  candidate_statute_ids: [LCL-9]
  severity_hint: A
  ask_fields: []
