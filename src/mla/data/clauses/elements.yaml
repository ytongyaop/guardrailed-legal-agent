# L2 辅助层的合同要素骨架（规格 003 第 4.3 节）：只写"合同由哪几部分组成、每部分该盯什么方向"。
# 不写具体数值、期限、百分比、法条条号，也不写"某句话有几种写法"——数值与条号归 L1（引用）与 L3（校验）。
#
# 字段：
#   element_id   固定编号，按劳动合同通常的叙述顺序排列
#   name         要素名
#   section_hints 段落特征词：只用于判断"这一段属于哪个要素"，不是写法穷举
#   focus        模型要判断的方向（写成"要确认什么 / 要分清什么"，不写结论、不写阈值）
#   impact       影响度默认值（高 / 中 / 低），供展示排序使用

- element_id: EL-1
  name: 当事人与基本信息
  section_hints: ["用人单位", "劳动者", "统一社会信用代码", "法定代表人"]
  impact: 低
  focus:
    - 双方主体是否都写明了身份与主体资格
    - 用人单位名称与其他登记信息是否彼此一致
    - 劳动者一侧的身份信息是否超出必要范围
    - 送达地址与联系方式是否留了可用的写法

- element_id: EL-2
  name: 合同期限
  section_hints: ["合同期限", "固定期限", "期限自", "无固定期限"]
  impact: 高
  focus:
    - 合同属于哪种期限类型是否明确写出
    - 起止时间是否完整且彼此不矛盾
    - 期限类型与试用期、续订约定是否自洽
    - 是否把续订或自动顺延写成了默认发生

- element_id: EL-3
  name: 试用期
  section_hints: ["试用", "考察期"]
  impact: 高
  focus:
    - 这一段有没有约定试用期（不约定本身不是缺陷）
    - 试用期是单独写，还是与合同期限或转正条件混写
    - 合同期限类型是否交代清楚（否则无从判断试用期档位）
    - 是否被约定成可以重复约定或可以延长
    - 试用期内的工资、社保、解除条件是否单独交代

- element_id: EL-4
  name: 工作内容与地点
  section_hints: ["工作内容", "工作岗位", "工作地点", "调岗"]
  impact: 高
  focus:
    - 岗位名称与职责范围是否写到可核对
    - 工作地点是一个还是多个、是否允许变更
    - 调岗调地是否被约定为用人单位单方决定
    - 岗位变动后的报酬与考核是否一并交代

- element_id: EL-5
  name: 工作时间与休息休假
  section_hints: ["工作时间", "工作制", "加班", "休息", "休假"]
  impact: 高
  focus:
    - 采用哪一种工时制度是否写明
    - 特殊工时是否交代了审批或告知程序
    - 加班的认定方式与安排方式是否有约定
    - 加班报酬与调休之间的取舍是否清楚
    - 各类假期的安排权与抵扣是否被单方拿走

- element_id: EL-6
  name: 劳动报酬
  section_hints: ["工资", "报酬", "薪酬", "发放"]
  impact: 高
  focus:
    - 工资由哪几个部分构成是否逐项写明
    - 支付周期与支付日是否明确
    - 工资调整是否被约定为单方决定
    - 延迟发放或扣减工资的条件是否交代
    - 加班费与经济补偿的计算基数是否与工资结构自洽

- element_id: EL-7
  name: 社会保险与福利
  section_hints: ["社会保险", "社保", "公积金", "福利"]
  impact: 高
  focus:
    - 社会保险的缴纳义务是否被约定免除或折现
    - 缴费主体与缴费基数是否交代
    - 工伤赔付责任是否被整体推给劳动者
    - 福利项目的范围与取得条件是否写明

- element_id: EL-8
  name: 劳动保护与职业危害
  section_hints: ["劳动保护", "职业危害", "防护", "工伤"]
  impact: 高
  focus:
    - 劳动保护与防护措施是否写进合同
    - 职业危害的告知与防护是否交代
    - 工伤与职业病的责任划分是否被预先免除
    - 安全培训与防护用品是否有落点

- element_id: EL-9
  name: 保密与竞业限制
  section_hints: ["保密", "保密义务", "竞业", "竞业限制"]
  impact: 高
  focus:
    - 保密义务的对象与范围有没有界定
    - 竞业限制是否与离职后的期间绑定
    - 竞业限制的岗位范围与地域是否交代
    - 单位一侧的补偿义务有没有出现
    - 保密义务与违约金是否被混为一谈

- element_id: EL-10
  name: 培训与违约金
  section_hints: ["培训", "服务期", "违约金"]
  impact: 高
  focus:
    - 违约金是否挂在培训或服务期这类法定事由上
    - 培训的性质与费用是否交代
    - 服务期的起止与违约后果是否对应
    - 违约金数额与实际损失之间是否有说明

- element_id: EL-11
  name: 变更、解除与终止
  section_hints: ["解除", "终止", "变更", "离职"]
  impact: 高
  focus:
    - 解除与终止的情形是否按主体分别写明
    - 单方解除的条件是否被写成任意事由
    - 劳动者辞职的通知期是否被拉长
    - 解除或终止后的经济补偿是否交代
    - 离职时已得报酬的结算是否被扣留

- element_id: EL-12
  name: 违约责任与争议解决
  section_hints: ["争议", "仲裁", "诉讼", "起诉"]
  impact: 中
  focus:
    - 争议解决方式是否写明且可执行
    - 是否把仲裁或诉讼途径预先排除
    - 管辖机构的选择是否对一方明显不利
    - 违约责任的承担方式是否交代

- element_id: EL-13
  name: 其他约定
  section_hints: ["其他约定", "附则"]
  impact: 低
  focus:
    - 兜底段落里是否藏了概括放弃权利的表述
    - 合同与规章制度、法律之间的效力顺序是否写明
    - 合同的修改与补充如何生效是否交代
    - 附件与手写内容的效力是否说明
